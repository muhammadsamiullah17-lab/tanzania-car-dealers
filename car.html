<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car details · Tanzania Car Dealers</title>
<link rel="icon" href="/assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<section>
  <div class="wrap" id="root"><p class="empty">Loading…</p></div>
</section>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" aria-label="Close">✕</button>
  <button class="lb-prev" aria-label="Previous photo">‹</button>
  <img alt="">
  <button class="lb-next" aria-label="Next photo">›</button>
  <div class="lb-count"></div>
</div>
<script src="/config.js"></script>
<script src="/cars.js"></script>
<script src="/assets/app.js"></script>
<script>
(function(){
  TCD.chrome("cars");
  var root = document.getElementById("root"), esc = TCD.esc;
  var id = new URLSearchParams(location.search).get("id") || "";

  function notFound(){
    root.innerHTML = '<h2>Car not found</h2><p class="sub">This car may have been sold or removed.</p><a class="btn btn-ghost" href="/#stock">See all cars</a>';
  }

  // Full-screen photo viewer with next/previous, arrow keys and swipe.
  var lb = document.getElementById("lightbox"), lbImg = lb.querySelector("img"), lbPhotos = [], lbIndex = 0;
  function lbShow(i){ lbIndex = (i + lbPhotos.length) % lbPhotos.length; lbImg.src = lbPhotos[lbIndex]; lb.querySelector(".lb-count").textContent = (lbIndex + 1) + " / " + lbPhotos.length; }
  function lbOpen(photos, i){ lbPhotos = photos; lb.hidden = false; document.body.style.overflow = "hidden"; lbShow(i); }
  function lbClose(){ lb.hidden = true; document.body.style.overflow = ""; }
  lb.querySelector(".lb-close").onclick = lbClose;
  lb.querySelector(".lb-prev").onclick = function(){ lbShow(lbIndex - 1); };
  lb.querySelector(".lb-next").onclick = function(){ lbShow(lbIndex + 1); };
  lb.addEventListener("click", function(e){ if (e.target === lb) lbClose(); });
  document.addEventListener("keydown", function(e){
    if (lb.hidden) return;
    if (e.key === "Escape") lbClose(); if (e.key === "ArrowLeft") lbShow(lbIndex - 1); if (e.key === "ArrowRight") lbShow(lbIndex + 1);
  });
  var touchX = null;
  lb.addEventListener("touchstart", function(e){ touchX = e.touches[0].clientX; });
  lb.addEventListener("touchend", function(e){ if (touchX == null) return; var dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 40) lbShow(lbIndex + (dx < 0 ? 1 : -1)); touchX = null; });

  function share(car, t){
    var url = location.href, text = t + " for " + TCD.money(car.price) + " on Tanzania Car Dealers";
    if (navigator.share) return navigator.share({ title: t, text: text, url: url }).catch(function(){});
    window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + url), "_blank", "noopener");
  }

  function similar(car, market){
    var list = market.cars.filter(function(c){ return c.id !== car.id && (c.make === car.make || c.body === car.body) && Math.abs(c.price - car.price) <= car.price * 0.4; })
      .sort(function(a, b){ return (b.make === car.make) - (a.make === car.make) || Math.abs(a.price - car.price) - Math.abs(b.price - car.price); }).slice(0, 4);
    return list.length ? '<h2 style="margin-top:36px">' + TCD.t("Similar cars") + '</h2><div class="grid">' + list.map(function(c){ return TCD.card(c, market.dealersById); }).join("") + '</div>' : "";
  }

  function inspectionPanel(car){
    var i = car.inspection; if (!i) return "";
    var areas = Object.keys(i.scores || {});
    return '<div class="panel" style="margin-top:24px"><h2 style="font-size:22px">✓ ' + TCD.t("Inspection report") + '</h2>' +
      '<p class="hint" style="margin:0">Tanzania Car Dealers · ' + new Date(i.date).toLocaleDateString() + '</p>' +
      '<div class="overall"><b>' + i.overall + '/10</b><span>' + TCD.t("Overall") + '</span></div>' +
      areas.map(function(a){ var v = i.scores[a], cls = v >= 75 ? "" : v >= 50 ? "mid" : "low";
        return '<div class="score"><span>' + esc(a) + '</span><span class="bar"><i class="' + cls + '" style="width:' + v + '%"></i></span><b>' + v + '%</b></div>'; }).join("") +
      '<div class="specs" style="margin-top:12px">' + [[i.mileageChecked, "Mileage checked"], [i.documentsChecked, "Documents checked"], [i.accidentFree, "No accident damage found"]]
        .filter(function(x){ return x[0]; }).map(function(x){ return "<span>✓ " + TCD.t(x[1]) + "</span>"; }).join("") + '</div>' +
      (i.notes ? '<p style="white-space:pre-line;margin:12px 0 0">' + esc(i.notes) + '</p>' : "") + '</div>';
  }

  var REASONS = ["Fake ad", "Already sold", "Wrong price", "Wrong phone number", "Scam or asked for deposit", "Other"];
  // Option 2: our team manages the purchase for the buyer.
  function throughUs(car){
    var sw = TCD.lang === "sw";
    return '<div class="panel through-us"><div class="way-label">' + (sw ? "Njia 2: Nunua kupitia sisi" : "Option 2: Let us manage it for you") + '</div>' +
      '<b style="font-size:17px">🤝 ' + (sw ? "Nunua kupitia Tanzania Car Dealers" : "Buy through Tanzania Car Dealers") + '</b> <span class="free-badge">' + (sw ? "BURE" : "FREE") + '</span>' +
      '<ul class="tips">' + (sw
        ? ["Tunakagua gari na nyaraka zake", "Tunapanga ukaguzi wa fundi", "Tunajadiliana bei kwa niaba yako", "Malipo salama na uhamisho wa umiliki TRA"]
        : ["We check the car and its papers", "We book a mechanic inspection", "We negotiate the price for you", "Safe payment and TRA ownership transfer"]).map(function(x){ return "<li>✓ " + x + "</li>"; }).join("") + '</ul>' +
      '<button class="btn btn-main" style="width:100%;margin-top:10px" id="through-btn">' + (sw ? "Tusaidie kununua gari hili" : "Ask us to buy this car for me") + '</button><div id="through-box" hidden style="margin-top:12px"></div></div>';
  }
  function throughForm(car){
    var box = document.getElementById("through-box"); box.hidden = false;
    var s = TCD.session.get(), back = encodeURIComponent(location.pathname + location.search);
    if (!s.token || s.kind !== "m") {
      box.innerHTML = '<p style="margin:0 0 8px">Create a free buyer account (1 minute) so we can follow up and you can see progress.</p><div class="btns" style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<a class="btn btn-main btn-sm" href="/signup?type=buyer&next=' + back + '">Create account</a><a class="btn btn-ghost btn-sm" href="/login?next=' + back + '">Log in</a></div>';
      return;
    }
    box.innerHTML = '<form id="through-form"><label>Your offer (optional, TZS)</label><input name="offer" type="number" min="0" step="100000" placeholder="' + car.price + '">' +
      '<label style="margin-top:8px">Anything we should know?</label><textarea name="message" maxlength="1000" placeholder="e.g. I want to see it this week; I need a loan" style="min-height:70px"></textarea>' +
      '<label style="margin-top:8px">How should we contact you?</label><select name="contactBy"><option value="whatsapp">WhatsApp</option><option value="call">Phone call</option></select>' +
      '<button class="btn btn-main btn-sm" style="margin-top:10px">Send request</button></form>';
    document.getElementById("through-form").addEventListener("submit", function(e){
      e.preventDefault(); var f = e.target.elements;
      TCD.api("account", "requestDeal", { adId: car.id, title: TCD.title(car), price: car.price, offer: f.offer.value, message: f.message.value, contactBy: f.contactBy.value })
        .then(function(j){ box.innerHTML = '<p class="notice ok" style="margin:0"><b>Request sent (' + esc(j.deal.ref) + ').</b> Our team will contact you soon. Follow progress in <a href="/account">My account</a>.</p>'; })
        .catch(function(ex){ if (ex.status === 401) { TCD.session.clear(); throughForm(car); return; } box.insertAdjacentHTML("afterbegin", '<p class="notice err">' + esc(ex.message) + '</p>'); });
    });
  }

  function reportForm(car){
    var box = document.getElementById("report-box"); box.hidden = false;
    box.innerHTML = '<form id="report-form"><label>Why are you reporting this ad?</label><select name="reason" required><option value="">Choose…</option>' +
      REASONS.map(function(r){ return '<option>' + r + '</option>'; }).join("") + '</select>' +
      '<textarea name="note" maxlength="1000" placeholder="What happened? (optional)" style="margin-top:8px;min-height:70px"></textarea>' +
      '<input name="phone" type="tel" placeholder="Your phone (optional, so we can follow up)" style="margin-top:8px"><input class="hp" name="website" tabindex="-1" autocomplete="off">' +
      '<button class="btn btn-main btn-sm" style="margin-top:8px">Send report</button></form>';
    document.getElementById("report-form").addEventListener("submit", function(e){
      e.preventDefault(); var f = e.target.elements;
      if (!f.reason.value) return;
      fetch("/api/public", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "report", adId: car.id, reason: f.reason.value, note: f.note.value, phone: f.phone.value, website: f.website.value }) })
        .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.error); }); })
        .then(function(){ box.innerHTML = '<p class="notice ok" style="margin:0">Thank you. Our team will check this ad.</p>'; })
        .catch(function(ex){ alert(ex.message); });
    });
  }

  var site = null;
  function show(car, dealer, market){
    var dealersById = {}; if (dealer) dealersById[dealer.id] = dealer;
    var s = TCD.sellerLabel(car, dealersById);
    var t = TCD.title(car);
    document.title = t + " · Tanzania Car Dealers";
    var photos = car.photos || [];
    var sold = car.status === "sold";
    var specs = [["Make", car.make], ["Model", car.model], ["Year", car.year], ["Mileage", TCD.fmt.format(car.km) + " km"], ["Engine", car.cc ? car.cc + " cc" : ""],
      ["Fuel", car.fuel], ["Gearbox", car.gearbox], ["Drive", car.drive], ["Body type", car.body], ["Colour", car.color], ["Assembly", car.assembly],
      ["Registered in", car.registeredIn], ["Previous owners", car.owners == null ? "" : car.owners === 0 ? "None (fresh import)" : car.owners >= 4 ? "4 or more" : car.owners],
      ["Location", car.city], ["Ad ID", car.id]].filter(function(r){ return r[1] !== "" && r[1] != null; });
    var reduced = car.priceDroppedAt && Date.now() - new Date(car.priceDroppedAt).getTime() < 14 * 864e5;
    root.innerHTML =
      '<div class="crumbs"><a href="/">Home</a> › <a href="/#stock">Cars</a> › ' + esc(t) + '</div>' +
      '<div class="detail"><div class="gallery">' +
        '<div class="main zoomable" id="main" title="Tap to enlarge">' + (photos.length ? '<img src="' + esc(photos[0]) + '" alt="' + esc(t) + '"><span class="zoom-hint">⤢ ' + photos.length + (photos.length === 1 ? " photo" : " photos") + '</span>' : TCD.carSvg(car.swatch)) + '</div>' +
        (photos.length > 1 ? '<div class="thumbs">' + photos.map(function(p, i){ return '<img src="' + esc(p) + '" data-i="' + i + '"' + (i ? "" : ' class="on"') + ' alt="Photo ' + (i + 1) + '">'; }).join("") + '</div>' : "") +
        '<div class="panel" style="margin-top:18px"><h2 style="font-size:20px">' + TCD.t("Details") + '</h2><table class="spec-table">' +
          specs.map(function(r){ return '<tr><td>' + TCD.t(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("") + '</table>' +
        ((car.features || []).length ? '<h2 style="font-size:20px;margin-top:20px">' + TCD.t("Features") + '</h2><ul class="feature-list">' + car.features.map(function(x){ return '<li>✓ ' + esc(x) + '</li>'; }).join("") + '</ul>' : "") +
        (car.description ? '<h2 style="font-size:20px;margin-top:20px">' + TCD.t("Description") + '</h2><p style="white-space:pre-line;margin:0">' + esc(car.description) + '</p>' : "") + '</div>' +
      '</div><aside class="side">' +
        '<div class="panel">' + (car.featured ? '<span class="verified" style="background:var(--yellow);color:#1b1b00;border-color:var(--yellow)">' + TCD.t("FEATURED") + '</span> ' : "") + (car.inspection ? '<span class="verified">✓ ' + TCD.t("TCD Inspected") + ' ' + car.inspection.overall + '/10</span> ' : "") +
          (reduced && !sold ? '<span class="verified" style="border-color:var(--danger);color:var(--danger);background:transparent">' + TCD.t("PRICE REDUCED") + '</span>' : "") +
          '<h1 style="font-size:26px;margin:8px 0 4px">' + esc(t) + '</h1>' +
          '<div class="price" style="font-size:26px">' + (sold ? TCD.t("SOLD") : TCD.money(car.price)) + '</div>' +
          '<p class="seller" style="margin:12px 0 16px">' + TCD.t("Sold by") + ' ' + (s.href ? '<a href="' + s.href + '">' + esc(s.name) + '</a>' : esc(s.name)) + (s.verified ? ' <span class="verified">✓ ' + TCD.t("Verified") + '</span>' : "") + '</p>' +
          (sold ? "" : '<div class="way-label">' + (TCD.lang === "sw" ? "Njia 1: Wasiliana na muuzaji moja kwa moja" : "Option 1: Contact the seller directly") + '</div><a class="btn btn-wa" style="width:100%" target="_blank" rel="noopener" href="' + esc(TCD.waLink(s.phone, TCD.enquiry(car))) + '">' + TCD.WA_ICON + TCD.t("Chat with seller on WhatsApp") + '</a>' +
            '<div class="btns" style="display:flex;gap:8px;margin-top:8px"><a class="btn btn-ghost" style="flex:1" href="tel:+' + esc(s.phone) + '">📞 ' + TCD.t("Call") + '</a><button class="btn btn-ghost" style="flex:1" id="share">↗ ' + TCD.t("Share") + '</button>' + TCD.saveButton(car.id, true).replace("♥", "♥ " + TCD.t("Save")) + '</div>') +
        '</div>' + (sold ? "" : throughUs(car) + TCD.deliveryBox((site || {}).delivery, (site || {}).deliveryNote, car.city)) +
        '<div class="panel"><b>' + TCD.t("Buy safely") + '</b><ul class="tips">' + ["See the car in person before paying.", "Check the registration card matches the seller.", "Never send a deposit to someone you have not met.", "Ask us for an inspection if you are unsure."].map(function(x){ return "<li>" + TCD.t(x) + "</li>"; }).join("") + '</ul>' +
          (car.house ? "" : '<button class="btn btn-ghost btn-sm" style="margin-top:12px" id="report-btn">⚑ ' + TCD.t("Report this ad") + '</button><div id="report-box" hidden style="margin-top:12px"></div>') + '</div>' +
      '</aside></div>' + inspectionPanel(car) + similar(car, market);
    var current = 0;
    if (photos.length) document.getElementById("main").addEventListener("click", function(){ lbOpen(photos, current); });
    root.querySelectorAll(".thumbs img").forEach(function(img){
      img.addEventListener("click", function(){
        current = Number(img.dataset.i);
        document.getElementById("main").querySelector("img").src = photos[current];
        root.querySelectorAll(".thumbs img").forEach(function(o){ o.classList.toggle("on", o === img); });
      });
    });
    var sb = document.getElementById("share"); if (sb) sb.addEventListener("click", function(){ share(car, t); });
    var rb = document.getElementById("report-btn"); if (rb) rb.addEventListener("click", function(){ reportForm(car); });
    TCD.bindDelivery(root, (site || {}).delivery);
    var tb = document.getElementById("through-btn"); if (tb) tb.addEventListener("click", function(){ throughForm(car); });
  }

  TCD.loadMarket().then(function(market){
    site = market.site;
    if (/^h\d+$/.test(id)) {
      var car = market.cars.filter(function(c){ return c.id === id; })[0];
      return car ? show(car, null, market) : notFound();
    }
    return fetch("/api/listings?id=" + encodeURIComponent(id))
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(d){ show(d.ad, d.dealer, market); });
  }).catch(notFound);
})();
</script>
</body>
</html>

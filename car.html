<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car details · Tanzania Car Dealers</title>
<link rel="icon" href="/assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<section>
  <div class="wrap" id="root"><p class="empty">Loading…</p></div>
</section>

<script src="/config.js"></script>
<script src="/cars.js"></script>
<script src="/assets/app.js"></script>
<script>
(function(){
  TCD.chrome("cars");
  var root = document.getElementById("root"), esc = TCD.esc;
  var id = new URLSearchParams(location.search).get("id") || "";

  function notFound(){
    root.innerHTML = '<h2>Car not found</h2><p class="sub">This car may have been sold or removed.</p><a class="btn btn-ghost" href="/#stock">See all cars</a>';
  }

  function show(car, dealer){
    var dealersById = {}; if (dealer) dealersById[dealer.id] = dealer;
    var s = TCD.sellerLabel(car, dealersById);
    var t = TCD.title(car);
    document.title = t + " · Tanzania Car Dealers";
    var photos = car.photos || [];
    var sold = car.status === "sold";
    root.innerHTML =
      '<div class="crumbs"><a href="/">Home</a> › <a href="/#stock">Cars</a> › ' + esc(t) + '</div>' +
      '<div class="detail"><div class="gallery">' +
        '<div class="main" id="main">' + (photos.length ? '<img src="' + esc(photos[0]) + '" alt="' + esc(t) + '">' : TCD.carSvg(car.swatch)) + '</div>' +
        (photos.length > 1 ? '<div class="thumbs">' + photos.map(function(p, i){ return '<img src="' + esc(p) + '" data-i="' + i + '"' + (i ? "" : ' class="on"') + ' alt="Photo ' + (i + 1) + '">'; }).join("") + '</div>' : "") +
        '<div class="panel" style="margin-top:18px"><h2 style="font-size:20px">Details</h2><table class="spec-table">' +
          [["Make", car.make], ["Model", car.model], ["Year", car.year], ["Mileage", TCD.fmt.format(car.km) + " km"], ["Fuel", car.fuel],
           ["Gearbox", car.gearbox], ["Body type", car.body], ["Colour", car.color || "–"], ["Location", car.city], ["Ad ID", car.id]]
            .map(function(r){ return '<tr><td>' + r[0] + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("") +
        '</table>' + (car.description ? '<h2 style="font-size:20px;margin-top:20px">Description</h2><p style="white-space:pre-line;margin:0">' + esc(car.description) + '</p>' : "") + '</div>' +
      '</div><aside class="side">' +
        '<div class="panel">' + (car.featured ? '<span class="verified" style="background:var(--yellow);color:#1b1b00;border-color:var(--yellow)">FEATURED</span>' : "") +
          '<h1 style="font-size:26px;margin:8px 0 4px">' + esc(t) + '</h1>' +
          '<div class="price" style="font-size:26px">' + (sold ? "SOLD" : TCD.money(car.price)) + '</div>' +
          '<p class="seller" style="margin:12px 0 16px">Sold by ' + (s.href ? '<a href="' + s.href + '">' + esc(s.name) + '</a>' : esc(s.name)) + (s.verified ? ' <span class="verified">✓ Verified</span>' : "") + '</p>' +
          (sold ? "" : '<a class="btn btn-wa" style="width:100%" target="_blank" rel="noopener" href="' + esc(TCD.waLink(s.phone, TCD.enquiry(car))) + '">' + TCD.WA_ICON + 'Chat with seller on WhatsApp</a>') +
        '</div>' +
        '<div class="panel"><b>Buy safely</b><ul class="tips"><li>See the car in person before paying.</li><li>Check the registration card matches the seller.</li><li>Never send a deposit to someone you have not met.</li><li>Ask us for an inspection if you are unsure.</li></ul>' +
          '<a class="btn btn-ghost btn-sm" style="margin-top:12px" target="_blank" rel="noopener" href="' + esc(TCD.waLink(window.SITE.whatsapp, "Hello, I want to report or ask about ad " + car.id + " (" + t + ").")) + '">Report this ad</a></div>' +
      '</aside></div>';
    root.querySelectorAll(".thumbs img").forEach(function(img){
      img.addEventListener("click", function(){
        document.getElementById("main").innerHTML = '<img src="' + esc(photos[img.dataset.i]) + '" alt="' + esc(t) + '">';
        root.querySelectorAll(".thumbs img").forEach(function(o){ o.classList.toggle("on", o === img); });
      });
    });
  }

  if (/^h\d+$/.test(id)) {
    var car = TCD.houseCars().filter(function(c){ return c.id === id; })[0];
    return car ? show(car, null) : notFound();
  }
  fetch("/api/listings?id=" + encodeURIComponent(id))
    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(d){ show(d.ad, d.dealer); })
    .catch(notFound);
})();
</script>
</body>
</html>

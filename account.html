<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My account · Tanzania Car Dealers</title>
<link rel="icon" href="/assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<style>
.status{border-radius:16px;padding:18px 20px;margin-bottom:20px;border:1px solid var(--line);background:var(--card)}
.status > b:first-child{font-size:18px;display:block;margin-bottom:4px}
.status.verified{display:block;font-size:15px;font-weight:400;color:var(--text);padding:18px 20px;border-radius:16px;border-color:var(--green);background:var(--soft)}
.status.review{border-color:#f1d27a;background:color-mix(in srgb,#fcd116 14%,var(--card))}
.status.rejected{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--card))}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.doc:last-child{border-bottom:0}
.doc .state{font-size:13.5px;color:var(--muted)}
.doc .state.ok{color:var(--green-dark)}
.req{font-size:11.5px;font-weight:700;color:var(--danger);margin-left:6px}
.opt{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:6px}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.myad{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.approved{background:var(--soft);color:var(--green-dark);border-color:var(--green)}
.pill.pending{background:#fff4d6;color:#7a5800;border-color:#f1d27a}
.stack{display:grid;gap:18px}
</style>
</head>
<body>
<section>
  <div class="wrap" style="max-width:860px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <h1 style="font-size:30px;margin:0" id="hello">My account</h1>
      <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" id="pw-btn">Change password</button><button class="btn btn-ghost btn-sm" id="logout">Log out</button></div>
    </div>
    <div id="flash"></div>
    <div id="root"><p class="empty">Loading…</p></div>
  </div>
</section>
<script src="/config.js"></script>
<script src="/assets/app.js"></script>
<script>
(function(){
  TCD.chrome("");
  var esc = TCD.esc, root = document.getElementById("root");
  var ID_TYPES = ["NIDA (National ID)", "Passport", "Driving licence", "Voter ID"];
  var state = { user: null, docKinds: [], ads: [], orders: [], deals: [] };

  if (!TCD.session.get().token || TCD.session.get().kind !== "m") { location.href = "/login?next=/account"; return; }
  function call(action, data){
    return TCD.api("account", action, data).catch(function(ex){
      if (ex.status === 401) { TCD.session.clear(); location.href = "/login?next=/account"; }
      throw ex;
    });
  }
  function flash(text, kind){
    var f = document.getElementById("flash");
    f.innerHTML = text ? '<div class="notice ' + (kind || "ok") + '">' + esc(text) + '</div>' : "";
    if (text) { f.scrollIntoView({ behavior: "smooth", block: "nearest" }); setTimeout(function(){ if (f.textContent === text) f.innerHTML = ""; }, 5000); }
  }
  document.getElementById("logout").addEventListener("click", function(){ TCD.session.clear(); location.href = "/"; });

  function statusBox(u){
    var phone = "+" + u.phone;
    if (u.type === "buyer") return '<div class="status verified"><b>Welcome! Find your next car</b>Save cars with ♥, contact sellers directly, or press <b>🤝 Buy through Tanzania Car Dealers</b> on any car and our team manages the purchase for you.' +
      '<div class="btns" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><a class="btn btn-main" href="/#stock">Browse cars</a><a class="btn btn-ghost" href="/saved">♥ Saved cars</a><a class="btn btn-ghost" href="/japan">🇯🇵 Import from Japan</a></div></div>';
    if (u.type === "private" && state.site && !state.site.privateSellersEnabled) return '<div class="status"><b>Private selling is paused</b>For now only verified car dealers can post cars. Your cars already on the site stay there and you can still edit, mark sold or delete them. Selling a car? <a target="_blank" rel="noopener" href="' + esc(TCD.waLink(window.SITE.whatsapp, "Hello, I want to sell my car through Tanzania Car Dealers.")) + '">Ask us on WhatsApp</a>.</div>';
    if (u.status === "verified") return '<div class="status verified"><b>✓ Your account is verified</b>You can now post cars for sale. Each car is checked by our team before it goes live.' +
      '<div style="margin-top:12px"><a class="btn btn-main" href="/sell">Post a car</a>' + (u.dealerId ? ' <a class="btn btn-ghost" href="/dealer?id=' + esc(u.dealerId) + '">My dealer page</a>' : "") + '</div></div>';
    if (u.status === "review") return '<div class="status review"><b>Waiting for verification</b>Thank you! Our team is checking your documents and will call or WhatsApp you on <b>' + esc(phone) + '</b> to confirm. This usually takes 1 working day.</div>';
    if (u.status === "rejected") return '<div class="status rejected"><b>We could not verify your account yet</b>' + esc(u.reviewMessage || "Please check your details and documents.") + '<br>Fix the problem below, then press <b>Send for verification</b> again.</div>';
    return '<div class="status"><b>Finish your account to start selling</b>Fill in your details and upload your documents below, then press <b>Send for verification</b>. Our team will check them and call you on <b>' + esc(phone) + '</b>.</div>';
  }

  function detailsForm(u){
    var locked = u.status === "verified" || u.status === "review";
    var dis = u.status === "verified" ? " disabled" : "";
    var b = u.business || {};
    return '<form id="details" class="panel"><h2 style="font-size:20px">1. Your details</h2>' +
      (u.status === "verified" ? '<p class="hint">Your details are verified. To change them, message us on WhatsApp.</p>' : locked ? '<p class="hint">You can still correct details while we review them.</p>' : "") +
      '<div class="form-grid">' +
      (u.type === "dealer" ?
        '<div class="full"><label>Business name *</label><input name="businessName" maxlength="100" value="' + esc(b.name) + '"' + dis + '></div>' +
        '<div><label>TIN number *</label><input name="tin" maxlength="30" value="' + esc(b.tin) + '"' + dis + '></div>' +
        '<div><label>Business licence number *</label><input name="licenceNo" maxlength="40" value="' + esc(b.licenceNo) + '"' + dis + '></div>' +
        '<div><label>BRELA registration number</label><input name="brelaNo" maxlength="40" value="' + esc(b.brelaNo) + '"' + dis + '></div>' +
        '<div><label>Business address *</label><input name="address" maxlength="160" value="' + esc(b.address) + '"' + dis + '></div>' : "") +
      '<div><label>' + (u.type === "dealer" ? "Owner / manager full name *" : "Full name (as on ID) *") + '</label><input name="fullName" maxlength="80" value="' + esc(u.fullName) + '"' + dis + '></div>' +
      '<div><label>City *</label><input name="city" maxlength="40" list="cities" value="' + esc(u.city) + '"' + dis + '></div>' +
      '<div><label>ID type *</label><select name="idType"' + dis + '><option value="">Choose…</option>' + ID_TYPES.map(function(t){ return '<option' + (u.idType === t ? " selected" : "") + '>' + t + '</option>'; }).join("") + '</select></div>' +
      '<div><label>ID number *</label><input name="idNumber" maxlength="40" value="' + esc(u.idNumber) + '"' + dis + '></div>' +
      '<div><label>Email</label><input name="email" type="email" maxlength="120" value="' + esc(u.email) + '"' + dis + '></div>' +
      '<div><label>Mobile number</label><input value="+' + esc(u.phone) + '" disabled><div class="hint">This is your login. Contact us to change it.</div></div>' +
      (u.status === "verified" ? "" : '<div class="full"><button class="btn btn-main">Save details</button></div>') +
      '</div></form>' +
      '<datalist id="cities"><option>Dar es Salaam</option><option>Arusha</option><option>Mwanza</option><option>Dodoma</option><option>Mbeya</option><option>Morogoro</option><option>Tanga</option><option>Moshi</option><option>Zanzibar</option></datalist>';
  }

  function docsPanel(u){
    var canEdit = u.status !== "verified";
    return '<div class="panel"><h2 style="font-size:20px">2. Documents</h2><p class="hint">Clear photos in good light, all four corners visible. Photos or PDF, max 3 MB each. Your documents are encrypted and only our verification team can see them.</p>' +
      state.docKinds.map(function(k){
        var d = (u.docs || []).filter(function(x){ return x.kind === k.kind; })[0];
        return '<div class="doc"><div><b>' + esc(k.label) + '</b>' + (k.required ? '<span class="req">REQUIRED</span>' : '<span class="opt">optional</span>') +
          '<div class="state' + (d ? " ok" : "") + '">' + (d ? "✓ Uploaded " + new Date(d.uploadedAt).toLocaleDateString() + " · " + esc(d.name) : "Not uploaded yet") + '</div></div>' +
          (canEdit ? '<span class="btn btn-ghost btn-sm upload">' + (d ? "Replace" : "Upload") + '<input type="file" accept="image/*,application/pdf" data-kind="' + k.kind + '"></span>' : "") + '</div>';
      }).join("") + '</div>';
  }

  function submitPanel(u){
    if (u.status === "verified" || u.status === "review") return "";
    var gaps = u.missing || [];
    return '<div class="panel"><h2 style="font-size:20px">3. Send for verification</h2>' +
      (gaps.length ? '<p class="hint">Still needed: <b>' + gaps.map(esc).join(", ") + '</b></p>' : '<p class="hint">Everything is ready. Our team will check your documents and call you.</p>') +
      '<button class="btn btn-main" id="submit"' + (gaps.length ? " disabled" : "") + '>Send for verification</button></div>';
  }

  function adsPanel(){
    if (state.user.status !== "verified" && !state.ads.length) return "";
    return '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:20px;margin:0">My cars</h2>' +
      (state.user.status === "verified" && canPost() ? '<a class="btn btn-main btn-sm" href="/sell">+ Post a car</a>' : "") + '</div>' +
      (state.ads.length ? state.ads.map(function(a){
        var label = { pending: a.editedAt ? "Changes waiting for approval" : "Waiting for approval", approved: "Live", sold: "Sold", rejected: "Not approved" }[a.status] || a.status;
        var live = a.status !== "sold";
        return '<div class="myad" data-ad="' + a.id + '"><div style="display:flex;gap:12px;align-items:center">' +
          (a.photos && a.photos[0] ? '<img src="' + esc(a.photos[0]) + '" alt="" style="width:72px;height:54px;object-fit:cover;border-radius:8px">' : "") +
          '<div><b>' + esc(TCD.title(a)) + '</b><div class="hint" style="margin:2px 0 0">' + TCD.money(a.price) + ' · posted ' + new Date(a.createdAt).toLocaleDateString() + '</div>' +
          '<span class="pill ' + a.status + '">' + label + '</span></div></div>' +
          '<div class="btns" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
            (a.status === "approved" ? '<a class="btn btn-ghost btn-sm" href="/car?id=' + a.id + '">View</a>' : "") +
            (a.status === "approved" && state.paidEnabled ? '<a class="btn btn-main btn-sm" href="/pay?ad=' + a.id + '">⭐ Feature</a>' : "") +
            (live ? '<a class="btn btn-ghost btn-sm" href="/sell?edit=' + a.id + '">Edit</a><button class="btn btn-ghost btn-sm" data-ad-act="price">Change price</button><button class="btn btn-ghost btn-sm" data-ad-act="sold">Mark sold</button>' : "") +
            '<button class="btn btn-danger btn-sm" data-ad-act="delete">Delete</button></div></div>';
      }).join("") : '<p class="empty" style="padding:10px 0">No cars yet.</p>') + '</div>';
  }

  var ORDER_LABEL = { pending: "Not paid yet", pushed: "Waiting for PIN", awaiting_check: "Checking payment", paid: "Paid", activated: "Active", rejected: "Not confirmed", failed: "Failed", cancelled: "Cancelled" };
  function paymentsPanel(){
    var u = state.user; if (u.status !== "verified" || (!state.paidEnabled && !state.orders.length)) return "";
    var dealerBox = u.type === "dealer" && u.dealerId && state.paidEnabled ? '<div class="sell-band" style="margin-bottom:14px;padding:18px"><div><b>Dealer package</b><p style="margin:4px 0 0">Silver or Gold: be shown first on the Dealers page. Gold also features all your live cars.</p></div><a class="btn btn-main btn-sm" href="/pay?dealer=1">Choose a package</a></div>' : "";
    var list = state.orders.slice(0, 10);
    return '<div class="panel"><h2 style="font-size:20px">Featured ads and payments</h2>' + dealerBox +
      (list.length || !state.paidEnabled ? list.map(function(o){
        var open = ["pending", "pushed", "awaiting_check", "rejected"].indexOf(o.status) !== -1;
        return '<div class="myad"><div><b>' + esc(o.packageName) + '</b> · ' + esc(o.itemTitle || "") + '<div class="hint" style="margin:2px 0 0">' + esc(o.ref) + " · " + TCD.money(o.amount) + " · " + new Date(o.createdAt).toLocaleDateString() +
          (o.activeUntil && o.status === "activated" ? " · active until " + new Date(o.activeUntil).toLocaleDateString() : "") + '</div></div>' +
          '<div><span class="pill ' + (o.status === "activated" ? "approved" : open ? "pending" : "sold") + '">' + (ORDER_LABEL[o.status] || o.status) + '</span>' + (open ? ' <a class="btn btn-ghost btn-sm" href="/pay?order=' + o.id + '">Open</a>' : "") + '</div></div>';
      }).join("") : '<p class="hint">Make a car stand out: press <b>⭐ Feature</b> next to any live car above.</p>') + '</div>';
  }

  function pwPanel(){
    return '<form id="pw" class="panel" hidden><h2 style="font-size:20px">Change password</h2><div class="form-grid">' +
      '<div class="full"><label>Current password</label><input name="cur" type="password" required autocomplete="current-password"></div>' +
      '<div><label>New password</label><input name="n1" type="password" minlength="8" required autocomplete="new-password"></div>' +
      '<div><label>Repeat new password</label><input name="n2" type="password" minlength="8" required autocomplete="new-password"></div>' +
      '<div class="full"><button class="btn btn-main">Save password</button></div></div></form>';
  }

  function canPost(){ return state.user.type === "dealer" || !state.site || state.site.privateSellersEnabled; }
  var DEAL_STEPS = ["new", "contacted", "inspection", "agreed", "completed"];
  function dealsPanel(){
    if (!state.deals.length) return state.user.type === "buyer" ? '<div class="panel"><h2 style="font-size:20px">Cars we are buying for you</h2><p class="hint">None yet. On any car page, press <b>🤝 Buy through Tanzania Car Dealers</b> and we take care of checking the car, the price, payment and papers.</p></div>' : "";
    return '<div class="panel"><h2 style="font-size:20px">Cars we are buying for you</h2>' + state.deals.map(function(d){
      var step = DEAL_STEPS.indexOf(d.status);
      return '<div class="myad" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>' + esc(d.adTitle) + '</b><div class="hint" style="margin:2px 0 0">' + esc(d.ref) + " · listed " + TCD.money(d.adPrice) + (d.offer ? " · your offer " + TCD.money(d.offer) : "") + " · " + new Date(d.createdAt).toLocaleDateString() + '</div></div>' +
        '<div><span class="pill ' + (d.status === "completed" ? "approved" : d.status === "cancelled" ? "sold" : "pending") + '">' + esc(d.statusLabel) + '</span> <a class="btn btn-ghost btn-sm" href="/car?id=' + esc(d.adId) + '">Car</a></div></div>' +
        (d.status !== "cancelled" ? '<div class="deal-steps">' + ["Request", "Talking to seller", "Inspection", "Price agreed", "Done"].map(function(s, i){ return '<span class="' + (i <= step ? "on" : "") + '">' + s + '</span>'; }).join("") + '</div>' : "") +
        (d.staffMessage ? '<p class="notice ok" style="margin:8px 0 0">💬 ' + esc(d.staffMessage) + '</p>' : "") + '</div>';
    }).join("") + '</div>';
  }
  function buyerDetails(u){
    return '<form id="details" class="panel"><h2 style="font-size:20px">Your details</h2><div class="form-grid">' +
      '<div><label>Full name *</label><input name="fullName" maxlength="80" value="' + esc(u.fullName) + '"></div>' +
      '<div><label>City</label><input name="city" maxlength="40" value="' + esc(u.city) + '"></div>' +
      '<div><label>Email</label><input name="email" type="email" maxlength="120" value="' + esc(u.email) + '"></div>' +
      '<div><label>Mobile number</label><input value="+' + esc(u.phone) + '" disabled></div>' +
      '<div class="full"><button class="btn btn-main">Save details</button></div></div></form>' +
      '<div class="panel"><h2 style="font-size:20px">Want to sell a car?</h2><p class="hint">Turn this into a seller account. We then check your ID (or business documents) and call you before you can post.</p>' +
      '<div class="btns" style="display:flex;gap:8px;flex-wrap:wrap">' + (state.site && !state.site.privateSellersEnabled ? "" : '<button class="btn btn-ghost" data-become="private">I am a private person</button>') + '<button class="btn btn-ghost" data-become="dealer">I am a car dealer</button></div></div>';
  }

  function render(){
    var u = state.user, name = u.type === "dealer" && u.business && u.business.name ? u.business.name : u.fullName.split(" ")[0];
    document.getElementById("hello").textContent = u.type === "dealer" ? "Dealer dashboard · " + name : "Hello, " + name;
    document.title = (u.type === "dealer" ? "Dealer dashboard" : "My account") + " · Tanzania Car Dealers";
    root.innerHTML = u.type === "buyer"
      ? statusBox(u) + '<div class="stack">' + pwPanel() + dealsPanel() + buyerDetails(u) + '</div>'
      : statusBox(u) + '<div class="stack">' + pwPanel() + adsPanel() + paymentsPanel() + dealsPanel() + detailsForm(u) + docsPanel(u) + submitPanel(u) + '</div>';
  }

  function load(){
    return Promise.all([call("me"), call("myAds"), call("myDeals")]).then(function(r){
      state.user = r[0].user; state.paidEnabled = r[0].paidEnabled; state.site = r[0].site; state.docKinds = r[0].docKinds; state.ads = r[1].ads; state.deals = r[2].deals; render();
      if (state.user.status === "verified") TCD.api("pay", "myOrders").then(function(j){ state.orders = j.orders; render(); }).catch(function(){});
      if (/new=1/.test(location.search)) { flash(state.user.type === "buyer" ? "Welcome! Your account is ready." : "Account created! Now add your details and documents."); history.replaceState(null, "", "/account"); }
    }).catch(function(ex){ root.innerHTML = '<p class="notice err">' + esc(ex.message) + '</p>'; });
  }

  document.getElementById("pw-btn").addEventListener("click", function(){ var p = document.getElementById("pw"); if (p) { p.hidden = !p.hidden; p.scrollIntoView({ behavior: "smooth" }); } });

  root.addEventListener("submit", function(e){
    e.preventDefault();
    var f = e.target.elements;
    if (e.target.id === "details") {
      var data = {};
      ["businessName", "tin", "licenceNo", "brelaNo", "address", "fullName", "city", "idType", "idNumber", "email"].forEach(function(k){ if (f[k]) data[k] = f[k].value; });
      call("updateProfile", data).then(function(j){ state.user = j.user; render(); flash("Details saved."); }).catch(function(ex){ flash(ex.message, "err"); });
    }
    if (e.target.id === "pw") {
      if (f.n1.value !== f.n2.value) return flash("The two new passwords are not the same.", "err");
      call("changePassword", { currentPassword: f.cur.value, newPassword: f.n1.value }).then(function(){ render(); flash("Password changed."); }).catch(function(ex){ flash(ex.message, "err"); });
    }
  });

  // Uploads go one at a time so two uploads can't overwrite each other's changes.
  var queue = Promise.resolve();
  root.addEventListener("change", function(e){
    var input = e.target;
    if (!input.dataset || !input.dataset.kind || !input.files[0]) return;
    var file = input.files[0], kind = input.dataset.kind;
    var holder = input.parentNode; holder.firstChild.textContent = "Uploading…";
    queue = queue.then(function(){
      var read = file.type === "application/pdf"
        ? new Promise(function(res, rej){
            if (file.size > 3 * 1024 * 1024) return rej(new Error("That PDF is larger than 3 MB. Please take a photo instead."));
            var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(new Error("Could not read the file.")); }; r.readAsDataURL(file);
          })
        : TCD.shrinkImage(file, 1800, 0.85);
      return read.then(function(data){ return call("uploadDoc", { kind: kind, data: data, name: file.name }); })
        .then(function(j){ state.user = j.user; render(); flash("Document uploaded."); })
        .catch(function(ex){ render(); flash(ex.message, "err"); });
    });
  });

  root.addEventListener("click", function(e){
    var bs = e.target.closest("[data-become]"); if (!bs) return;
    var asDealer = bs.dataset.become === "dealer", businessName = "";
    if (asDealer) { businessName = prompt("Your business name (as on your business licence):"); if (!businessName) return; }
    else if (!confirm("Change to a seller account? You will upload your ID and selfie, and our team will call you to verify.")) return;
    call("becomeSeller", { asDealer: asDealer, businessName: businessName }).then(function(){ return load(); }).then(function(){ flash("Done! Now add your details and documents, then send them for verification."); })
      .catch(function(ex){ flash(ex.message, "err"); });
  });

  root.addEventListener("click", function(e){
    var b = e.target.closest("[data-ad-act]"); if (!b) return;
    var id = b.closest("[data-ad]").dataset.ad, ad = state.ads.filter(function(a){ return a.id === id; })[0];
    function done(text){ return call("myAds").then(function(r){ state.ads = r.ads; render(); flash(text); }); }
    if (b.dataset.adAct === "price") {
      var v = prompt("New price in TZS for your " + TCD.title(ad) + " (now " + TCD.money(ad.price) + "):", ad.price);
      if (!v) return;
      call("setMyAdPrice", { id: id, price: Number(String(v).replace(/[^\d]/g, "")) }).then(function(){ return done("Price updated."); }).catch(function(ex){ flash(ex.message, "err"); });
    }
    if (b.dataset.adAct === "sold") {
      if (!confirm("Mark your " + TCD.title(ad) + " as sold? It will be taken off the site.")) return;
      call("markMyAdSold", { id: id }).then(function(){ return done("Marked as sold. Congratulations!"); }).catch(function(ex){ flash(ex.message, "err"); });
    }
    if (b.dataset.adAct === "delete") {
      if (!confirm("Delete your " + TCD.title(ad) + " and its photos? This cannot be undone.")) return;
      call("deleteMyAd", { id: id }).then(function(){ return done("Car deleted."); }).catch(function(ex){ flash(ex.message, "err"); });
    }
  });

  root.addEventListener("click", function(e){
    if (e.target.id !== "submit") return;
    e.target.disabled = true;
    call("submitForReview").then(function(j){ state.user = j.user; render(); flash("Sent! We will call you soon to confirm."); window.scrollTo({ top: 0, behavior: "smooth" }); })
      .catch(function(ex){ e.target.disabled = false; flash(ex.message, "err"); });
  });

  load();
})();
</script>
</body>
</html>
